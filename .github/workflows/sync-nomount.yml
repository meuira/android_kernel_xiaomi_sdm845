name: Sync NoMount

on:
  workflow_dispatch:
  schedule:
    - cron: '12 */6 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
         ref: staging
         submodules: recursive
         fetch-depth: 0
         token: ${{ secrets.PAT_TOKEN }}

    - name: Sync NoMount Repository
      run: |
        git config user.name "GitHub"
        git config user.email "noreply@github.com"

        cd NoMount
        git fetch origin master

        CURRENT_COMMIT=$(git rev-parse HEAD)
        TARGET_COMMIT=$(git rev-parse FETCH_HEAD)

        if [ "$CURRENT_COMMIT" != "$TARGET_COMMIT" ]; then
          echo "Updates found: $CURRENT_COMMIT -> $TARGET_COMMIT"

          git checkout $TARGET_COMMIT

          RAW_MSG=$(git log -1 --pretty=format:"%B" $TARGET_COMMIT)
          AUTHOR_NAME=$(git log -1 --pretty=format:"%an" $TARGET_COMMIT)
          AUTHOR_EMAIL=$(git log -1 --pretty=format:"%ae" $TARGET_COMMIT)

          COMMIT_MSG=$(echo "$RAW_MSG" | head -n 1 | sed -E 's/#([0-9]+)/maxsteeel\/nomount#\1/g')

          cd ..
          git add NoMount
          GIT_COMMITTER_NAME="$AUTHOR_NAME" GIT_COMMITTER_EMAIL="$AUTHOR_EMAIL" \
          git commit --author="$AUTHOR_NAME <$AUTHOR_EMAIL>" -m "$COMMIT_MSG"

          git push origin staging
        else
          echo "Updates not found in NoMount!"
        fi
